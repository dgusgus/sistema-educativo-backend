services:
  postgres:
    image: postgres:16-alpine
    container_name: ue_angeles_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # Se lee del archivo .env (la misma que usa DATABASE_URL). Si falta, docker compose avisa.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ue_angeles
    ports:
      # Solo accesible desde tu propia máquina (antes quedaba expuesto a toda la red)
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: